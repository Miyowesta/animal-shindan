<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIメッセージのテスト</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; line-height: 1.7; }
  #ai-message { background: #f4f1ea; border-radius: 8px; padding: 12px 16px; }
</style>
</head>
<body>
<h1>AIメッセージのテスト</h1>
<p id="ai-message">AIがメッセージを書いています…</p>

<script>
const API_URL = "https://my-api-api.miyowesta.workers.dev";

async function showAiMessage(text) {
  const box = document.getElementById("ai-message");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok || !data.message) throw new Error(data.error);
    box.textContent = data.message;
  } catch (e) {
    box.textContent = "AIからのメッセージを取得できませんでした。時間をおいて、もう一度お試しください。";
  }
}

// 例：診断の結果が出たところで呼ぶ
showAiMessage("診断結果：ネコ。選んだ答え：休みの日は家でゆっくりしたい");
</script>
</body>
</html>
